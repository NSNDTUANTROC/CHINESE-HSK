<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Từ Vựng HSK Pro - TRẦN ANH TUẤN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #059669;
            --success-light: rgba(209, 250, 229, 0.85);
            --danger: #dc2626;
            --danger-light: rgba(254, 226, 226, 0.85);
            --warning: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-dark: #0f172a;
            --text-muted: #475569;
            
            --header-bg-start: rgba(238, 242, 255, 0.95);
            --header-bg-end: rgba(224, 231, 255, 0.95);
            --header-text: #3730a3;
            --header-border: #c7d2fe;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px;
            color: var(--text-dark);
            font-size: 14px; 
            box-sizing: border-box;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 50%, #bae6fd 100%);
        }

        .falling-decor {
            position: fixed;
            top: -10vh;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            font-size: 24px;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        .container-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 700;
            color: #1e1b4b;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .app-title .pro-tag {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            vertical-align: middle;
            box-shadow: 0 2px 5px rgba(236, 72, 153, 0.4);
        }

        .owner-badge {
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #f472b6;
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.2);
            backdrop-filter: blur(8px);
        }

        .owner-badge .owner-info { display: flex; flex-direction: column; line-height: 1.2; }
        .owner-badge .owner-name { font-weight: 700; font-size: 13px; color: #db2777; letter-spacing: 0.5px; }
        .owner-badge .owner-class { font-size: 11px; color: #4f46e5; font-weight: 600; }

        .controls { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            align-items: center; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            padding: 14px 18px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 2px solid rgba(244, 114, 182, 0.4);
        }

        .controls label {
            font-weight: 600;
            font-size: 13px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls select, .controls input[type="number"] {
            padding: 7px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-weight: 600;
            background: #ffffff;
            transition: all 0.2s;
        }

        .btn { 
            padding: 8px 16px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            color: white; 
            font-size: 13px; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

        .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .main-layout { 
            display: flex; 
            gap: 20px; 
            align-items: flex-start;
        }

        .table-container { 
            flex: 1; 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 16px; 
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
            border: 2px solid rgba(244, 114, 182, 0.4);
            overflow-x: auto; 
        }
        
        table { 
            width: 100%; 
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed; 
        }

        th { 
            background: linear-gradient(135deg, var(--header-bg-start), var(--header-bg-end)) !important;
            color: var(--header-text) !important;
            font-weight: 700 !important;
            font-size: 13px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px !important;
            border-top: 1.5px solid var(--header-border) !important;
            border-bottom: 2px solid #f472b6 !important;
        }

        th:first-child { border-left: 1.5px solid var(--header-border); border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        th:last-child { border-right: 1.5px solid var(--header-border); border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

        td { 
            border-bottom: 1px solid rgba(203, 213, 225, 0.6); 
            padding: 12px 6px; 
            text-align: center; 
            word-wrap: break-word; 
        }

        td.col-hanzi { 
            font-family: 'Kaiti', 'STKaiti', 'KaiTi_GB2312', 'Noto Serif SC', 'Microsoft YaHei', serif;
            font-size: 22px; 
            font-weight: 700 !important;
            color: #be185d;
        }

        td.col-pinyin { color: #475569; font-style: italic; font-size: 14px; font-weight: 500; }
        td.col-stt { color: #475569; font-weight: 600; }
        td.col-type { color: #0284c7; font-size: 12px; font-weight: 600; }
        td.col-viet { font-weight: 600; color: #1e293b; }
        td.col-status { font-weight: 700; }

        .col-stt { width: 6%; }
        .col-hanzi { width: 18%; }
        .col-type { width: 12%; }
        .col-pinyin { width: 16%; }
        .col-viet { width: 25%; }
        .col-input { width: 18%; }
        .col-status { width: 8%; }

        input[type="text"] { 
            width: 85%; 
            padding: 8px 10px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 15px; 
            font-weight: 500;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
        }

        input[type="text"]:focus {
            border-color: #ec4899;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
        }
        
        tr.row-correct td { background-color: var(--success-light) !important; color: #064e3b; }
        tr.row-wrong td { background-color: var(--danger-light) !important; color: #7f1d1d; }

        .stats-dashboard { 
            width: 250px; 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 18px; 
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
            border: 2px solid rgba(244, 114, 182, 0.4);
        }

        .stats-dashboard h3 { font-size: 13px; margin: 0 0 12px 0; text-transform: uppercase; color: #db2777; font-weight: 700; }

        .timer-box {
            background: linear-gradient(135deg, #e0e7ff, #fce7f3);
            border: 1.5px solid #f472b6;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 14px;
        }
        .timer-box .timer-label { font-size: 11px; color: #4f46e5; font-weight: 700; text-transform: uppercase; }
        .timer-box .timer-value { font-size: 20px; font-weight: 800; color: #db2777; margin-top: 2px; font-family: monospace; }

        .progress-bar-bg { width: 100%; height: 8px; background-color: rgba(203, 213, 225, 0.6); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ec4899, #8b5cf6); transition: width 0.4s ease; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: rgba(255, 255, 255, 0.85); padding: 10px; border-radius: 10px; border: 1.5px solid #fbcfe8; text-align: center; }
        .stat-card .label { font-size: 11px; color: #475569; margin-bottom: 4px; font-weight: 600; }
        .stat-card .value { font-size: 16px; font-weight: 700; }

        .rate-card { margin-top: 12px; text-align: center; background: rgba(253, 242, 248, 0.9); padding: 12px; border-radius: 12px; border: 1.5px solid #f472b6; }

        .footer-owner { text-align: center; margin-top: 18px; padding-top: 12px; border-top: 1px dashed #cbd5e1; font-size: 11px; color: #475569; font-weight: 500; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .main-layout { flex-direction: column; }
            .stats-dashboard { width: 100%; box-sizing: border-box; }
            .col-stt, .col-type, .col-status { display: none; }
            .col-hanzi { width: 28%; } .col-pinyin { width: 22%; } .col-viet { width: 26%; } .col-input { width: 24%; }
        }
    </style>
</head>
<body>

    <script>
        const symbols = ['🌸', '🌺', '🌷', '🌻', '🍃', '🍀', '✨', '💮'];
        for (let i = 0; i < 22; i++) {
            const div = document.createElement('div');
            div.className = 'falling-decor';
            div.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = (Math.random() * 6 + 6) + 's';
            div.style.animationDelay = (Math.random() * 5) + 's';
            div.style.fontSize = (Math.random() * 12 + 18) + 'px';
            document.body.appendChild(div);
        }
    </script>

    <div class="container-wrapper">
        <div class="app-header">
            <h2 class="app-title">🌸 Luyện Từ Vựng HSK <span class="pro-tag">PRO VIP</span> 🌺</h2>
            <div class="owner-badge">
                <span>👑</span>
                <div class="owner-info">
                    <span class="owner-name">TRẦN ANH TUẤN</span>
                    <span class="owner-class">C7 CB K139-140</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <label class="btn btn-green">
                📁 Chọn Excel
                <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;">
            </label>
            
            <label>Chế độ: 
                <select id="modeSelect">
                    <option value="pinyin_to_chinese">Gõ Pinyin/Tiếng Trung</option>
                    <option value="chinese_to_meaning">Gõ Nghĩa Tiếng Việt</option>
                </select>
            </label>

            <label>Số câu: 
                <input type="number" id="quizSize" value="10" min="1" style="width: 45px; text-align: center;">
            </label>

            <button class="btn btn-purple" id="btnNewQuiz">🔀 Đổi đề</button>
            <button class="btn btn-orange" id="btnRetryQuiz">🔄 Làm lại</button>
            <button class="btn btn-red" id="btnReset">🗑 Xóa data</button>
            <span id="loadingStatus" style="font-size: 13px; font-weight: 600; color: var(--success); margin-left: auto;"></span>
        </div>

        <div class="main-layout">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-stt">STT</th>
                            <th class="col-hanzi">Chữ Hán</th>
                            <th class="col-type">Loại từ</th>
                            <th class="col-pinyin">Pinyin</th>
                            <th class="col-viet">Tiếng Việt</th>
                            <th class="col-input">Ô Nhập</th>
                            <th class="col-status">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="vocabTable"></tbody>
                </table>
            </div>

            <div class="stats-dashboard">
                <div class="timer-box">
                    <div class="timer-label">⏱ Thời gian làm bài</div>
                    <div class="timer-value" id="timerDisplay">00:00</div>
                </div>

                <h3>📊 Tiến độ bài tập</h3>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="label">Tổng số câu</div><div class="value" id="statTotal">0</div></div>
                    <div class="stat-card"><div class="label">Đã hoàn thành</div><div class="value" id="statDone">0</div></div>
                    <div class="stat-card" style="border-color: #a7f3d0; background: rgba(240, 253, 244, 0.9);"><div class="label" style="color: #065f46;">Số câu Đúng</div><div class="value" style="color: var(--success);" id="statCorrect">0</div></div>
                    <div class="stat-card" style="border-color: #fecaca; background: rgba(254, 242, 242, 0.9);"><div class="label" style="color: #991b1b;">Số câu Sai</div><div class="value" style="color: var(--danger);" id="statWrong">0</div></div>
                </div>
                <div class="rate-card">
                    <div style="font-size: 11px; color: #be185d; font-weight: 700;">TỶ LỆ CHÍNH XÁC</div>
                    <div style="font-size: 22px; font-weight: 700; color: #db2777; margin-top: 2px;" id="statRate">0.0%</div>
                </div>
                <div class="footer-owner">Bản quyền thuộc sở hữu:<br><b>TRẦN ANH TUẤN - C7 CB K139-140</b></div>
            </div>
        </div>
    </div>

    <script>
        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "工人", "type": "Danh từ", "pinyin": "gōngrén", "meaning": "Công nhân"},
            {"chinese": "经理", "type": "Danh từ", "pinyin": "jīnglǐ", "meaning": "Giám đốc"},
            {"chinese": "谁", "type": "Đại từ", "pinyin": "shéi / shuí", "meaning": "Ai"},
            {"chinese": "哪儿 / 哪里", "type": "Đại từ nghi vấn", "pinyin": "Nǎr / Nǎlǐ", "meaning": "Đâu, chỗ nào"},
            {"chinese": "睡觉", "type": "Động từ", "pinyin": "shuì jiào", "meaning": "Ngủ"}
        ];

        let fullVocabData = [];
        let currentQuizData = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let isTimerRunning = false;

        window.onload = function() {
            const savedData = localStorage.getItem('hsk_vocab_data');
            if (savedData) {
                try { fullVocabData = JSON.parse(savedData); } 
                catch(e) { fullVocabData = [...EMBEDDED_VOCAB_DATA]; }
            } else {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            startNewQuiz();
        };

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            secondsElapsed = 0;
            isTimerRunning = false;
            updateTimerDisplay();
        }

        function checkAndStartTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('loadingStatus');
            if (statusText) { statusText.innerText = "⏳ Đang đọc file..."; statusText.style.color = "var(--primary)"; }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (!json || json.length === 0) return;

                    fullVocabData = json.map(row => {
                        let chinese = '', type = '', pinyin = '', meaning = '';
                        Object.keys(row).forEach(key => {
                            const cleanKey = key.toString().trim().toUpperCase();
                            const val = row[key] ? row[key].toString().trim() : '';
                            if (cleanKey.includes('CHINESE') || cleanKey.includes('TRUNG') || cleanKey.includes('HÁN')) chinese = val;
                            else if (cleanKey.includes('PINYIN') || cleanKey.includes('PHÁT ÂM')) pinyin = val;
                            else if (cleanKey.includes('MEANING') || cleanKey.includes('VIỆT') || cleanKey.includes('NGHĨA')) meaning = val;
                            else if (cleanKey.includes('TYPE') || cleanKey.includes('LOẠI')) type = val;
                        });
                        return { chinese, type, pinyin, meaning };
                    }).filter(item => item.chinese || item.meaning);

                    localStorage.setItem('hsk_vocab_data', JSON.stringify(fullVocabData));
                    if (statusText) { statusText.innerText = `✅ Đã nạp ${fullVocabData.length} từ!`; statusText.style.color = "var(--success)"; }
                    startNewQuiz();
                } catch (err) { alert("Lỗi đọc file Excel: " + err.message); }
            };
            reader.readAsArrayBuffer(file);
        });

        function startNewQuiz() {
            if (!fullVocabData || fullVocabData.length === 0) fullVocabData = [...EMBEDDED_VOCAB_DATA];
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            const shuffled = [...fullVocabData].sort(() => 0.5 - Math.random());
            currentQuizData = shuffled.slice(0, Math.min(size, fullVocabData.length));
            resetTimer(); // Đổi đề xong reset đồng hồ về 00:00, chờ gõ mới chạy
            renderTable();
        }

        function retryCurrentQuiz() { 
            if (currentQuizData.length > 0) {
                resetTimer();
                renderTable();
            } 
        }

        function renderTable() {
            const tbody = document.getElementById('vocabTable');
            const mode = document.getElementById('modeSelect').value;
            tbody.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                const isPinyinMode = (mode === 'pinyin_to_chinese');
                
                tr.innerHTML = `
                    <td class="col-stt">${index + 1}</td>
                    <td id="chinese_${index}" class="col-hanzi">${isPinyinMode ? '***' : item.chinese}</td>
                    <td class="col-type">${item.type}</td>
                    <td id="pinyin_${index}" class="col-pinyin">***</td>
                    <td id="meaning_${index}" class="col-viet">${!isPinyinMode ? '***' : item.meaning}</td>
                    <td class="col-input">
                        <input type="text" id="input_${index}" 
                               enterkeyhint="next" 
                               oninput="checkAndStartTimer()"
                               onblur="checkAnswer(${index})"
                               onkeydown="handleKeyDown(event, ${index})">
                    </td>
                    <td id="status_${index}" class="col-status">-</td>
                `;
                tbody.appendChild(tr);
            });
            updateStats();
        }

        function handleKeyDown(event, index) {
            checkAndStartTimer();
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                checkAnswer(index); 
                
                const nextInput = document.getElementById(`input_${index + 1}`);
                if (nextInput) {
                    nextInput.focus();
                    if (nextInput.select) nextInput.select();
                }
            }
        }

        function checkAnswer(index) {
            const statusTd = document.getElementById(`status_${index}`);
            if (statusTd && (statusTd.innerText.includes('Đúng') || statusTd.innerText.includes('Sai'))) {
                return;
            }

            const inputEl = document.getElementById(`input_${index}`);
            if (!inputEl) return;
            
            const inputVal = inputEl.value.trim().toLowerCase();
            const mode = document.getElementById('modeSelect').value;
            const item = currentQuizData[index];
            const rowTr = document.getElementById(`row_${index}`);
            const isPinyinMode = (mode === 'pinyin_to_chinese');

            if (inputVal === '') {
                return;
            }

            let isCorrect = false;

            const splitOptions = (text) => {
                if (!text) return [];
                return text.split(/[\/,;]/)
                           .flatMap(part => part.split(/\s+hoặc\s+/i))
                           .map(s => s.trim().toLowerCase())
                           .filter(s => s.length > 0);
            };

            if (mode === 'pinyin_to_chinese') {
                const pinyinOptions = splitOptions(item.pinyin);
                const chineseOptions = splitOptions(item.chinese);

                if (pinyinOptions.includes(inputVal) || chineseOptions.includes(inputVal)) {
                    isCorrect = true;
                }
            } else {
                const meaningOptions = splitOptions(item.meaning);
                isCorrect = meaningOptions.some(option => 
                    option === inputVal || (inputVal.length >= 2 && option.includes(inputVal))
                );
            }

            if (isCorrect) {
                statusTd.innerText = '✓ Đúng';
                statusTd.style.color = 'var(--success)';
                rowTr.className = 'row-correct'; 
                document.getElementById(`chinese_${index}`).innerText = item.chinese;
                document.getElementById(`pinyin_${index}`).innerText = item.pinyin;
                document.getElementById(`meaning_${index}`).innerText = item.meaning;
            } else {
                statusTd.innerText = '✗ Sai';
                statusTd.style.color = 'var(--danger)';
                rowTr.className = 'row-wrong'; 
                document.getElementById(`chinese_${index}`).innerText = item.chinese;
                document.getElementById(`pinyin_${index}`).innerText = item.pinyin;
                document.getElementById(`meaning_${index}`).innerText = item.meaning;
            }

            inputEl.disabled = true;
            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0, correct = 0, wrong = 0;

            currentQuizData.forEach((_, index) => {
                const statusTd = document.getElementById(`status_${index}`);
                if (statusTd) {
                    if (statusTd.innerText.includes('Đúng')) { done++; correct++; } 
                    else if (statusTd.innerText.includes('Sai')) { done++; wrong++; }
                }
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statWrong').innerText = wrong;
            
            const rate = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
            document.getElementById('statRate').innerText = `${rate}%`;
            document.getElementById('progressBar').style.width = `${total > 0 ? (done / total) * 100 : 0}%`;

            if (done === total && total > 0) {
                stopTimer();
            }
        }

        document.getElementById('btnNewQuiz').addEventListener('click', startNewQuiz);
        document.getElementById('btnRetryQuiz').addEventListener('click', retryCurrentQuiz);
        document.getElementById('modeSelect').addEventListener('change', startNewQuiz);
        document.getElementById('btnReset').addEventListener('click', function() {
            localStorage.removeItem('hsk_vocab_data');
            fullVocabData = [...EMBEDDED_VOCAB_DATA];
            startNewQuiz();
            alert("Đã khôi phục dữ liệu về mặc định!");
        });
    </script>
</body>
</html>
