<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Từ Vựng HSK - Dạng Bảng BÀI TẬP</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #107c41; /* Màu xanh lá Excel */
      --bg: #f3f2f1;
      --border: #e1dfdd;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); margin: 0; padding: 20px; }

    .header-panel {
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8f9fa;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .range-group input {
      width: 55px;
      padding: 4px 6px;
      border: 1px solid #8a8886;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-purple { background: #6b21a8; } /* Màu tím nút Random */
    .btn-warning { background: #d97706; } /* Màu cam nút Restart */
    .btn-danger { background: #d13438; }

    .main-layout { display: flex; gap: 20px; align-items: flex-start; }
    .table-container { flex: 1; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f8f9fa; border: 1px solid var(--border); padding: 10px; text-align: center; color: #323130; }
    td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; }

    input.user-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #8a8886;
      border-radius: 3px;
      font-size: 14px;
      outline: none;
    }
    input.user-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16,124,65,0.2); }

    .badge-good { background: #dff6dd; color: #107c41; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
    .badge-false { background: #fde7e9; color: #d13438; font-weight: bold; padding: 4px 8px; border-radius: 4px; }

    /* Bảng thống kê bên phải */
    .stat-box {
      width: 220px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 20px;
    }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f3f2f1; font-size: 14px; }
    .stat-row.total { font-weight: bold; color: #d13438; border-bottom: none; font-size: 16px; margin-top: 5px; }
  </style>
</head>
<body>

<div class="header-panel">
  <input type="file" id="excel-file" accept=".xlsx, .xls" style="display:none;">
  <button class="btn" onclick="document.getElementById('excel-file').click()">📁 Chọn File Excel</button>
  
  <label><b>Chế độ:</b></label>
  <select id="mode-select" onchange="renderTable()" style="padding: 6px; border-radius: 4px;">
    <option value="vi-to-cn">Gõ Pinyin/Tiếng Trung (Từng Tiếng Việt)</option>
    <option value="cn-to-vi">Gõ Nghĩa Tiếng Việt (Từ Chữ Hán)</option>
  </select>

  <!-- Ô CHỌN SỐ CÂU RANDOM -->
  <div class="range-group">
    <label style="font-size: 13px; font-weight: 600;">Số câu/lần:</label>
    <input type="number" id="quiz-count" value="10" min="1" onchange="pickRandomQuestions()">
  </div>

  <!-- NÚT THAO TÁC -->
  <button class="btn btn-purple" onclick="pickRandomQuestions()">🔀 Đổi 10 câu mới</button>
  <button class="btn btn-warning" onclick="restartQuiz()">🔄 Làm lại đề này</button>
  
  <button class="btn btn-danger" onclick="clearData()" style="margin-left:auto;">🗑 Xóa file Excel</button>
</div>

<div class="main-layout">
  <!-- BẢNG ĐIỀN TỪ VỰNG -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 50px;">STT</th>
          <th style="width: 120px;">CHỮ HÁN</th>
          <th style="width: 100px;">LOẠI TỪ</th>
          <th style="width: 120px;">PINYIN</th>
          <th>NGHĨA TIẾNG VIỆT</th>
          <th style="width: 200px;">Ô NHẬP ĐÁP ÁN</th>
          <th style="width: 90px;">ĐÚNG/SAI</th>
        </tr>
      </thead>
      <tbody id="vocab-body">
        <tr><td colspan="7" style="padding: 30px; color: #666;">Vui lòng tải file Excel lên để bắt đầu bài kiểm tra!</td></tr>
      </tbody>
    </table>
  </div>

  <!-- BẢNG THỐNG KÊ BÊN PHẢI -->
  <div class="stat-box">
    <h3 style="margin-top:0; font-size:16px; text-align:center; color:#323130;">KẾT QUẢ</h3>
    <div class="stat-row"><span>Tổng số câu:</span> <b id="stat-total">0</b></div>
    <div class="stat-row"><span>Đã làm:</span> <b id="stat-done">0</b></div>
    <div class="stat-row" style="color:#107c41;"><span>Đúng:</span> <b id="stat-right">0</b></div>
    <div class="stat-row" style="color:#d13438;"><span>Sai:</span> <b id="stat-wrong">0</b></div>
    <div class="stat-row total"><span>Tỷ lệ:</span> <span id="stat-percent">0.0%</span></div>
  </div>
</div>

<script>
  let rawData = [];
  let displayList = []; 
  let userAnswers = {}; 

  window.onload = function() {
    const saved = localStorage.getItem('hsk_sheet_data');
    if (saved) {
      rawData = JSON.parse(saved);
      pickRandomQuestions();
    }
  };

  document.getElementById('excel-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const worksheet = workbook.Sheets[workbook.SheetNames[0]];
      rawData = XLSX.utils.sheet_to_json(worksheet);

      if (rawData.length > 0) {
        localStorage.setItem('hsk_sheet_data', JSON.stringify(rawData));
        pickRandomQuestions();
      }
    };
    reader.readAsArrayBuffer(file);
  });

  function pickRandomQuestions() {
    if (rawData.length === 0) return;

    let count = parseInt(document.getElementById('quiz-count').value) || 10;
    if (count > rawData.length) count = rawData.length;
    if (count < 1) count = 1;

    let shuffled = rawData.map((item, idx) => ({ ...item, originalIndex: idx }));
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    displayList = shuffled.slice(0, count);
    userAnswers = {}; 
    renderTable();
  }

  function restartQuiz() {
    if (confirm("Xóa đáp án đã nhập để làm lại bộ 10 câu này từ đầu?")) {
      userAnswers = {};
      renderTable();
    }
  }

  function clearData() {
    if (confirm("Xóa file Excel hiện tại để chọn file khác?")) {
      localStorage.removeItem('hsk_sheet_data');
      rawData = [];
      displayList = [];
      userAnswers = {};
      document.getElementById('vocab-body').innerHTML = `<tr><td colspan="7" style="padding: 30px; color: #666;">Vui lòng tải file Excel lên!</td></tr>`;
      updateStats();
    }
  }

  function renderTable() {
    const tbody = document.getElementById('vocab-body');
    const mode = document.getElementById('mode-select').value;
    tbody.innerHTML = '';

    if (displayList.length === 0) return;

    displayList.forEach((item, posIndex) => {
      const origIndex = item.originalIndex;
      const stt = posIndex + 1;
      const chinese = item['CHENESE'] || item['CHINESE'] || '';
      const vocab = item['VOCABULARY'] || item['Loại từ'] || '';
      const pinyin = item['PINYIN'] || '';
      const meaning = item['MEANING'] || item['Nghĩa tiếng Việt'] || '';

      const uAns = userAnswers[origIndex] || { text: '', status: '' };
      const isRight = uAns.status === 'GOOD';

      const tr = document.createElement('tr');

      if (mode === 'vi-to-cn') {
        // Chế độ 1: Cho Nghĩa Việt -> Gõ Chữ Hán/Pinyin (Ẩn Chữ Hán & Pinyin)
        tr.innerHTML = `
          <td><b>${stt}</b></td>
          <td>${isRight ? chinese : '???'}</td>
          <td>${vocab}</td>
          <td>${isRight ? pinyin : '???'}</td>
          <td style="text-align:left; font-weight:600;">${meaning}</td>
          <td>
            <input type="text" class="user-input" data-pos="${posIndex}" value="${uAns.text}" 
                   onkeydown="handleKeyDown(event, ${posIndex}, ${origIndex}, '${chinese}', '${pinyin}', '${meaning}')">
          </td>
          <td>${getStatusBadge(uAns.status)}</td>
        `;
      } else {
        // Chế độ 2: Cho Chữ Hán -> Gõ Nghĩa Việt (Ẩn Pinyin & Nghĩa Việt)
        tr.innerHTML = `
          <td><b>${stt}</b></td>
          <td style="font-size:18px; font-weight:bold;">${chinese}</td>
          <td>${vocab}</td>
          <td>${isRight ? pinyin : '???'}</td>
          <td style="text-align:left;">${isRight ? meaning : '???'}</td>
          <td>
            <input type="text" class="user-input" data-pos="${posIndex}" value="${uAns.text}" 
                   onkeydown="handleKeyDown(event, ${posIndex}, ${origIndex}, '${chinese}', '${pinyin}', '${meaning}')">
          </td>
          <td>${getStatusBadge(uAns.status)}</td>
        `;
      }
      tbody.appendChild(tr);
    });

    updateStats();
  }

  function handleKeyDown(event, posIndex, origIndex, chinese, pinyin, meaning) {
    if (event.key === 'Enter') {
      event.preventDefault(); 
      const inputVal = event.target.value;
      
      checkAnswer(origIndex, inputVal, chinese, pinyin, meaning);

      setTimeout(() => {
        const nextInput = document.querySelector(`input.user-input[data-pos="${posIndex + 1}"]`);
        if (nextInput) {
          nextInput.focus();
          nextInput.select();
        }
      }, 50);
    }
  }

  function checkAnswer(origIndex, inputVal, chinese, pinyin, meaning) {
    const mode = document.getElementById('mode-select').value;
    const cleanInput = inputVal.trim().toLowerCase();
    
    if (!cleanInput) {
      delete userAnswers[origIndex];
      renderTable();
      return;
    }

    let isCorrect = false;

    if (mode === 'vi-to-cn') {
      const cleanPinyin = pinyin.trim().toLowerCase();
      const cleanChinese = chinese.trim().toLowerCase();
      if (cleanInput === cleanPinyin || cleanInput === cleanChinese) {
        isCorrect = true;
      }
    } else {
      const cleanMeaning = meaning.trim().toLowerCase();
      if (cleanMeaning.includes(cleanInput) || cleanInput.includes(cleanMeaning)) {
        isCorrect = true;
      }
    }

    userAnswers[origIndex] = {
      text: inputVal,
      status: isCorrect ? 'GOOD' : 'FALSE'
    };

    renderTable();
  }

  function getStatusBadge(status) {
    if (status === 'GOOD') return `<span class="badge-good">Good</span>`;
    if (status === 'FALSE') return `<span class="badge-false">FALSE</span>`;
    return '';
  }

  function updateStats() {
    const total = displayList.length;
    let done = 0;
    let right = 0;
    let wrong = 0;

    displayList.forEach(item => {
      const origIdx = item.originalIndex;
      if (userAnswers[origIdx]) {
        done++;
        if (userAnswers[origIdx].status === 'GOOD') right++;
        if (userAnswers[origIdx].status === 'FALSE') wrong++;
      }
    });

    const percent = done > 0 ? ((right / done) * 100).toFixed(1) : '0.0';

    document.getElementById('stat-total').innerText = total;
    document.getElementById('stat-done').innerText = done;
    document.getElementById('stat-right').innerText = right;
    document.getElementById('stat-wrong').innerText = wrong;
    document.getElementById('stat-percent').innerText = `${percent}%`;
  }
</script>

</body>
</html>
