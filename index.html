<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luyện Tập Từ Vựng Hán Ngữ</title>
  <style>
    /* ==========================================
       1. CẤU TRÚC CHUNG & RESPONSIVE (MOBILE FIRST)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      padding: 10px;
      color: #333;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* ==========================================
       2. KHU VỰC BẢNG ĐIỀU KHIỂN (CONTROLS)
       ========================================== */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
      background: #f8f9ff;
      padding: 12px;
      border-radius: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      color: #4a5568;
    }

    select, input[type="number"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }

    select {
      flex: 1;
    }

    .range-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .range-inputs input {
      width: 60px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn-primary { background-color: #4f46e5; }
    .btn-warning { background-color: #f59e0b; }
    .btn-danger { background-color: #ef4444; }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* ==========================================
       3. BẢNG TỪ VỰNG (TABLE & MOBILE RESPONSIVE)
       ========================================== */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    th, td {
      padding: 10px 4px;
      text-align: center;
      font-size: 13px;
      border-bottom: 1px solid #edf2f7;
      word-wrap: break-word;
    }

    th {
      background-color: #eef2ff;
      color: #3730a3;
      font-weight: 700;
    }

    .col-stt { width: 10%; }
    .col-hanzi { width: 22%; font-size: 16px; font-weight: bold; }
    .col-type { width: 18%; color: #059669; font-size: 11px; }
    .col-pinyin { width: 20%; font-style: italic; color: #4b5563; }
    .col-viet { width: 30%; color: #1f2937; }
    .col-input { width: 25%; }

    /* Custom Input trong bảng */
    .user-input {
      width: 95%;
      padding: 6px 4px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .user-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    /* TRẠNG THÁI KHÓA ĐÁP ÁN (LOCKED) */
    .user-input:disabled {
      background-color: #f3f4f6;
      color: #374151;
      font-weight: bold;
      cursor: not-allowed;
    }

    /* Màu kết quả Đúng / Sai */
    .user-input.correct {
      background-color: #d1fae5 !important;
      border-color: #10b981 !important;
      color: #065f46 !important;
    }

    .user-input.incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    /* Thống kê */
    .stats-panel {
      margin-top: 15px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="control-panel">
    <div class="control-row">
      <label for="mode-select">🎯 Chế độ:</label>
      <select id="mode-select" onchange="renderTable()">
        <option value="1">1. Chỉ gõ Chữ Hán (Hiện Tiếng Việt)</option>
        <option value="2">2. Gõ Chữ Hán HOẶC Pinyin (Hiện Tiếng Việt)</option>
        <option value="3">3. Gõ Tiếng Việt (Hiện Chữ Hán)</option>
      </select>
    </div>

    <div class="control-row">
      <label for="question-count">📝 Số câu:</label>
      <input type="number" id="question-count" value="10" min="1" max="50">

      <label>📊 Khoảng:</label>
      <div class="range-inputs">
        <input type="number" id="range-from" value="1">
        <span>đến</span>
        <input type="number" id="range-to" value="10">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="generateQuiz()">⚡ Đổi đề</button>
      <button class="btn btn-warning" onclick="resetAnswers()">♻️ Làm lại</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-stt">STT</th>
          <th class="col-hanzi">CHỮ HÁN</th>
          <th class="col-type">LOẠI TỪ</th>
          <th class="col-pinyin">PINYIN</th>
          <th class="col-viet">TIẾNG VIỆT</th>
          <th class="col-input">Ô NHẬP</th>
        </tr>
      </thead>
      <tbody id="quiz-tbody">
        </tbody>
    </table>
  </div>

  <div class="stats-panel">
    <span>Đã làm: <span id="done-count">0</span>/<span id="total-count">0</span></span>
    <span>Đúng: <span id="correct-count" style="color: #10b981;">0</span></span>
    <span>Tỷ lệ: <span id="accuracy-rate">0%</span></span>
  </div>
</div>

<script>
  // ==========================================
  // DỮ LIỆU TỪ VỰNG MẪU (DATABASE)
  // ==========================================
  const vocabularyData = [
    { id: 1, hanzi: "少", type: "Tính từ", pinyin: "shǎo", viet: "Ít" },
    { id: 2, hanzi: "块", type: "Lượng từ", pinyin: "kuài", viet: "Đồng (đơn vị tiền tệ)" },
    { id: 3, hanzi: "角", type: "Lượng từ", pinyin: "jiǎo", viet: "Hào (1/10 đồng)" },
    { id: 4, hanzi: "分", type: "Lượng từ", pinyin: "fēn", viet: "Xu (1/100 đồng)" },
    { id: 5, hanzi: "牛肉", type: "Danh từ", pinyin: "niúròu", viet: "Thịt bò" },
    { id: 6, hanzi: "鸡蛋汤", type: "Danh từ", pinyin: "jīdàntāng", viet: "Canh trứng gà" },
    { id: 7, hanzi: "馒头", type: "Danh từ", pinyin: "mántou", viet: "Màn thầu, bánh bao" },
    { id: 8, hanzi: "红烧鱼", type: "Danh từ", pinyin: "hóngshāoyú", viet: "Cá kho" },
    { id: 9, hanzi: "买单", type: "Cụm động từ", pinyin: "mǎidān", viet: "Thanh toán, tính tiền" },
    { id: 10, hanzi: "电脑", type: "Danh từ", pinyin: "diànnǎo", viet: "Máy tính" }
  ];

  let currentQuizData = [];

  // Chuẩn hóa chuỗi (Xóa khoảng trắng thừa, viết hoa/thường, chuẩn hóa dấu tiếng Việt)
  function cleanText(str) {
    if (!str) return "";
    return str.toString().trim().toLowerCase().normalize("NFC").replace(/\s+/g, " ");
  }

  // TẠO ĐỀ MỚI
  function generateQuiz() {
    const count = parseInt(document.getElementById('question-count').value) || 10;
    const from = Math.max(1, parseInt(document.getElementById('range-from').value) || 1);
    const to = Math.min(vocabularyData.length, parseInt(document.getElementById('range-to').value) || vocabularyData.length);

    // Lọc danh sách theo khoảng
    let filtered = vocabularyData.filter(item => item.id >= from && item.id <= to);
    
    // Trộn ngẫu nhiên
    filtered.sort(() => Math.random() - 0.5);

    // Lấy số lượng câu yêu cầu
    currentQuizData = filtered.slice(0, count);

    renderTable();
  }

  // HIỂN THỊ BẢNG
  function renderTable() {
    const tbody = document.getElementById('quiz-tbody');
    const mode = document.getElementById('mode-select').value;
    tbody.innerHTML = '';

    currentQuizData.forEach((item, index) => {
      let hanziText = item.hanzi;
      let pinyinText = item.pinyin;
      let vietText = item.viet;

      // Xử lý ẩn/hiện cột theo Chế độ
      if (mode === "1" || mode === "2") {
        hanziText = "***";
        pinyinText = "***";
      } else if (mode === "3") {
        vietText = "***";
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td class="col-hanzi">${hanziText}</td>
        <td class="col-type">${item.type}</td>
        <td class="col-pinyin">${pinyinText}</td>
        <td class="col-viet">${vietText}</td>
        <td>
          <input type="text" 
                 class="user-input" 
                 data-index="${index}" 
                 placeholder="Nhập..." 
                 onblur="checkAndLock(this)"
                 onkeydown="handleKeyDown(event, this)">
        </td>
      `;
      tbody.appendChild(tr);
    });

    updateStats();
  }

  // SỰ KIỆN PHÍM ENTER -> CHUYỂN Ô VÀ KHÓA Ô HIỆN TẠI
  function handleKeyDown(event, inputElem) {
    if (event.key === 'Enter') {
      event.preventDefault();
      inputElem.blur(); // Mất focus để kích hoạt hàm checkAndLock

      // Chuyển sang ô nhập tiếp theo nếu có
      const currentIndex = parseInt(inputElem.getAttribute('data-index'));
      const nextInput = document.querySelector(`.user-input[data-index="${currentIndex + 1}"]`);
      if (nextInput) {
        nextInput.focus();
      }
    }
  }

  // XỬ LÝ KIỂM TRA ĐÁP ÁN VÀ KHÓA Ô (LOCK)
  function checkAndLock(inputElem) {
    const userVal = cleanText(inputElem.value);
    
    // Nếu ô trống thì chưa thực hiện khóa
    if (!userVal) return;

    const index = parseInt(inputElem.getAttribute('data-index'));
    const item = currentQuizData[index];
    const mode = document.getElementById('mode-select').value;

    let isCorrect = false;

    // Kiểm tra theo từng chế độ
    if (mode === "1") { // Chỉ gõ Chữ Hán
      isCorrect = (userVal === cleanText(item.hanzi));
    } else if (mode === "2") { // Gõ Chữ Hán HOẶC Pinyin
      isCorrect = (userVal === cleanText(item.hanzi) || userVal === cleanText(item.pinyin));
    } else if (mode === "3") { // Gõ Tiếng Việt
      // Hỗ trợ đáp án chứa nhiều từ cách nhau bởi dấu phẩy hoặc gạch chéo
      const validAnswers = item.viet.split(/[/,]/).map(ans => cleanText(ans));
      isCorrect = validAnswers.some(ans => ans === userVal);
    }

    // Đánh dấu đúng/sai
    if (isCorrect) {
      inputElem.classList.add('correct');
      inputElem.classList.remove('incorrect');
    } else {
      inputElem.classList.add('incorrect');
      inputElem.classList.remove('correct');
    }

    // YÊU CẦU: Khóa ô nhập không cho chỉnh sửa sau khi đã nhập
    inputElem.disabled = true;

    updateStats();
  }

  // CẬP NHẬT THỐNG KÊ
  function updateStats() {
    const inputs = Array.from(document.querySelectorAll('.user-input'));
    const total = inputs.length;
    const doneInputs = inputs.filter(i => i.disabled);
    const correctInputs = inputs.filter(i => i.classList.contains('correct'));

    document.getElementById('total-count').textContent = total;
    document.getElementById('done-count').textContent = doneInputs.length;
    document.getElementById('correct-count').textContent = correctInputs.length;

    const rate = doneInputs.length > 0 ? Math.round((correctInputs.length / doneInputs.length) * 100) : 0;
    document.getElementById('accuracy-rate').textContent = rate + '%';
  }

  // NÚT LÀM LẠI (MỞ KHÓA VÀ XÓA DỮ LIỆU ĐÃ NHẬP)
  function resetAnswers() {
    const inputs = document.querySelectorAll('.user-input');
    inputs.forEach(input => {
      input.value = '';
      input.disabled = false;
      input.classList.remove('correct', 'incorrect');
    });
    updateStats();
  }

  // Khởi chạy khi tải trang
  window.onload = function() {
    generateQuiz();
  };
</script>

</body>
</html>
