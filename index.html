<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Từ Vựng HSK</title>
    <!-- Thư viện SheetJS đọc file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ================= CSS GIAO DIỆN CHUNG ================= */
        body { 
            font-family: Arial, sans-serif; 
            margin: 15px; 
            background-color: #f4f4f9; 
            font-size: 14px; 
        }
        
        .controls { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            align-items: center; 
            background: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }

        .controls label, .controls button, .controls select, .controls input[type="number"] { 
            font-size: 13px; 
        }
        
        .btn { 
            padding: 6px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            font-size: 13px; 
            white-space: nowrap; 
            display: inline-block;
        }

        .btn-green { background-color: #28a745; }
        .btn-purple { background-color: #6f42c1; }
        .btn-orange { background-color: #fd7e14; }
        .btn-red { background-color: #dc3545; }
        
        .container { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
        }

        .table-container { 
            flex: 1; 
            min-width: 300px; 
            background: #fff; 
            border-radius: 8px; 
            padding: 12px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            overflow-x: auto; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }

        th, td { 
            border: 1px solid #ddd; 
            padding: 8px 4px; 
            text-align: center; 
            word-wrap: break-word; 
        }

        th { 
            background-color: #f8f9fa; 
            font-size: 13px; 
        }
        
        /* Tỉ lệ các cột */
        .col-stt { width: 6%; }
        .col-hanzi { width: 18%; font-size: 16px; font-weight: bold; }
        .col-type { width: 12%; }
        .col-pinyin { width: 16%; }
        .col-viet { width: 25%; }
        .col-input { width: 15%; }
        .col-status { width: 8%; }

        input[type="text"] { 
            width: 90%; 
            padding: 6px 2px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            text-align: center; 
            font-size: 13px; 
        }
        
        .correct { color: #28a745; font-weight: bold; }
        .wrong { color: #dc3545; font-weight: bold; }
        
        .stats-card { 
            width: 200px; 
            background: #fff; 
            border-radius: 8px; 
            padding: 12px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            height: fit-content; 
        }

        .stats-card h3 { font-size: 15px; margin-top: 0; margin-bottom: 10px; }
        .stats-card p { margin: 6px 0; font-size: 13px; }
        
        .loading-msg { 
            font-style: italic; 
            color: #28a745; 
            font-weight: bold; 
            margin-left: 5px; 
            font-size: 12px; 
        }

        @media (max-width: 600px) {
            body { margin: 5px; font-size: 12px; }
            .controls { padding: 8px; gap: 6px; justify-content: center; }
            .btn { padding: 5px 8px; font-size: 11px; }
            .container { flex-direction: column; gap: 10px; }
            .table-container { padding: 4px; }
            th, td { padding: 5px 2px; font-size: 11px; }
            .col-stt, .col-type, .col-status { display: none; }
            .col-hanzi { width: 26%; font-size: 14px; }
            .col-pinyin { width: 22%; }
            .col-viet { width: 28%; }
            .col-input { width: 24%; }
            input[type="text"] { font-size: 12px; padding: 4px 0; width: 95%; }
            .stats-card { width: auto; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <label class="btn btn-green">
            📁 Chọn File Excel khác
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;">
        </label>
        
        <label>Chế độ: 
            <select id="modeSelect">
                <option value="pinyin_to_chinese">Gõ Pinyin/Tiếng Trung (Từng Tiếng Việt)</option>
                <option value="chinese_to_meaning">Gõ Nghĩa Tiếng Việt (Từng Tiếng Trung)</option>
            </select>
        </label>

        <label>Số câu: 
            <input type="number" id="quizSize" value="10" min="1" style="width: 40px; text-align: center;">
        </label>

        <button class="btn btn-purple" id="btnNewQuiz">🔀 Đổi câu mới</button>
        <button class="btn btn-orange" id="btnRetryQuiz">🔄 Làm lại đề này</button>
        <button class="btn btn-red" id="btnReset">🗑 Xóa dữ liệu tạm</button>
        <span id="loadingStatus" class="loading-msg"></span>
    </div>

    <div class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-stt">STT</th>
                        <th class="col-hanzi">CHỮ HÁN</th>
                        <th class="col-type">LOẠI TỪ</th>
                        <th class="col-pinyin">PINYIN</th>
                        <th class="col-viet">NGHĨA TIẾNG VIỆT</th>
                        <th class="col-input">Ô NHẬP</th>
                        <th class="col-status">ĐÚNG/SAI</th>
                    </tr>
                </thead>
                <tbody id="vocabTable"></tbody>
            </table>
        </div>

        <div class="stats-card">
            <h3 style="text-align: center;">KẾT QUẢ</h3>
            <p>Tổng số câu: <b id="statTotal">0</b></p>
            <p>Đã làm: <b id="statDone">0</b></p>
            <p style="color: #28a745;">Đúng: <b id="statCorrect">0</b></p>
            <p style="color: #dc3545;">Sai: <b id="statWrong">0</b></p>
            <p>Tỷ lệ: <b id="statRate" style="color: #dc3545;">0.0%</b></p>
        </div>
    </div>

    <script>
        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "工人", "type": "Danh từ", "pinyin": "gōngrén", "meaning": "Công nhân"},
            {"chinese": "经理", "type": "Danh từ", "pinyin": "jīnglǐ", "meaning": "Giám đốc"},
            {"chinese": "谁", "type": "Đại từ", "pinyin": "shéi / shuí", "meaning": "Ai"},
            {"chinese": "包子", "type": "Danh từ", "pinyin": "bāozi", "meaning": "Bánh bao (có nhân)"},
            {"chinese": "睡觉", "type": "Động từ", "pinyin": "shuì jiào", "meaning": "Ngủ"}
        ];

        let fullVocabData = [];
        let currentQuizData = [];

        window.onload = function() {
            const savedData = localStorage.getItem('hsk_vocab_data');
            if (savedData) {
                try {
                    fullVocabData = JSON.parse(savedData);
                } catch(e) {
                    fullVocabData = [...EMBEDDED_VOCAB_DATA];
                }
            } else {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            startNewQuiz();
        };

        // Đọc File Excel
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('loadingStatus');
            if (statusText) statusText.innerText = "⏳ Đang nạp...";

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = e.target.result;
                    const workbook = XLSX.read(data, { type: 'binary' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (!json || json.length === 0) {
                        alert("File Excel trống hoặc không đọc được dữ liệu!");
                        if (statusText) statusText.innerText = "";
                        return;
                    }

                    fullVocabData = json.map(row => ({
                        chinese: row['CHENESE'] || row['Tiếng Trung'] || row['Chữ Hán'] || row['Word'] || row['Chinese'] || row['CHỮ HÁN'] || '',
                        type: row['VOCABULARY'] || row['Loại từ'] || row['Type'] || row['LOẠI TỪ'] || '',
                        pinyin: row['PINYIN'] || row['Pinyin'] || row['Phát âm'] || row['Phien am'] || '',
                        meaning: row['MEANING'] || row['Tiếng Việt'] || row['Nghĩa'] || row['Meaning'] || row['NGHĨA TIẾNG VIỆT'] || ''
                    })).filter(item => item.chinese || item.meaning);

                    localStorage.setItem('hsk_vocab_data', JSON.stringify(fullVocabData));
                    if (statusText) statusText.innerText = "✅ Đã nạp xong!";
                    startNewQuiz();
                    alert("Thành công! Đã nạp " + fullVocabData.length + " từ vựng.");

                } catch (err) {
                    alert("Lỗi đọc file: " + err.message);
                    if (statusText) statusText.innerText = "❌ Lỗi file";
                }
            };
            reader.readAsBinaryString(file);
        });

        function startNewQuiz() {
            if (!fullVocabData || fullVocabData.length === 0) {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            const shuffled = [...fullVocabData].sort(() => 0.5 - Math.random());
            currentQuizData = shuffled.slice(0, Math.min(size, fullVocabData.length));
            renderTable();
        }

        function retryCurrentQuiz() {
            if (currentQuizData.length === 0) return;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('vocabTable');
            const mode = document.getElementById('modeSelect').value;
            tbody.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                const isPinyinMode = (mode === 'pinyin_to_chinese');
                
                const chineseDisplay = isPinyinMode ? '***' : item.chinese;
                const pinyinDisplay = '***'; // Ẩn Pinyin ở cả 2 chế độ
                const meaningDisplay = !isPinyinMode ? '***' : item.meaning;

                tr.innerHTML = `
                    <td class="col-stt">${index + 1}</td>
                    <td id="chinese_${index}" class="col-hanzi">${chineseDisplay}</td>
                    <td class="col-type">${item.type}</td>
                    <td id="pinyin_${index}" class="col-pinyin">${pinyinDisplay}</td>
                    <td id="meaning_${index}" class="col-viet">${meaningDisplay}</td>
                    <td class="col-input">
                        <input type="text" id="input_${index}" 
                               enterkeyhint="next" 
                               oncompositionend="handleCompositionEnd(${index})"
                               onkeydown="handleKeyDown(event, ${index})">
                    </td>
                    <td id="status_${index}" class="col-status">-</td>
                `;
                tbody.appendChild(tr);
            });

            updateStats();
            
            // Tự động focus câu đầu tiên
            setTimeout(() => {
                const firstInput = document.getElementById('input_0');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        // Tự động nhảy ô ngay khi VỪA CHỌN CHỮ HÁN từ bàn phím điện thoại
        function handleCompositionEnd(index) {
            setTimeout(() => {
                moveToNext(index);
            }, 80);
        }

        function moveToNext(index) {
            checkAnswer(index);
            const nextInput = document.getElementById(`input_${index + 1}`);
            if (nextInput) {
                setTimeout(() => {
                    nextInput.focus();
                    if (nextInput.select) nextInput.select();
                }, 100);
            }
        }

        function handleKeyDown(event, index) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                moveToNext(index);
            }
        }

        function checkAnswer(index) {
            const inputEl = document.getElementById(`input_${index}`);
            if (!inputEl) return;
            
            const inputVal = inputEl.value.trim().toLowerCase();
            const mode = document.getElementById('modeSelect').value;
            const item = currentQuizData[index];
            const statusTd = document.getElementById(`status_${index}`);

            if (inputVal === '') {
                statusTd.innerText = '-';
                statusTd.className = 'col-status';
                updateStats();
                return;
            }

            let isCorrect = false;
            if (mode === 'pinyin_to_chinese') {
                const targetPinyin = (item.pinyin || '').toLowerCase();
                const targetChinese = (item.chinese || '').toLowerCase();
                if (inputVal === targetPinyin || inputVal === targetChinese) {
                    isCorrect = true;
                }
            } else {
                const targetMeaning = (item.meaning || '').toLowerCase();
                if (targetMeaning.includes(inputVal) && inputVal.length >= 1) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                statusTd.innerText = '✓ Đúng';
                statusTd.className = 'col-status correct';
            } else {
                statusTd.innerText = '✗ Sai';
                statusTd.className = 'col-status wrong';
            }

            // Mở hiện thông tin bị ẩn
            document.getElementById(`chinese_${index}`).innerText = item.chinese;
            document.getElementById(`pinyin_${index}`).innerText = item.pinyin;
            document.getElementById(`meaning_${index}`).innerText = item.meaning;

            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0, correct = 0, wrong = 0;

            currentQuizData.forEach((_, index) => {
                const statusTd = document.getElementById(`status_${index}`);
                if (statusTd) {
                    if (statusTd.classList.contains('correct')) {
                        done++;
                        correct++;
                    } else if (statusTd.classList.contains('wrong')) {
                        done++;
                        wrong++;
                    }
                }
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statWrong').innerText = wrong;
            
            const rate = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        document.getElementById('btnNewQuiz').addEventListener('click', startNewQuiz);
        document.getElementById('btnRetryQuiz').addEventListener('click', retryCurrentQuiz);
        document.getElementById('modeSelect').addEventListener('change', renderTable);
        document.getElementById('btnReset').addEventListener('click', function() {
            localStorage.removeItem('hsk_vocab_data');
            fullVocabData = [...EMBEDDED_VOCAB_DATA];
            const statusText = document.getElementById('loadingStatus');
            if (statusText) statusText.innerText = "";
            startNewQuiz();
            alert("Đã xóa dữ liệu tạm và khôi phục về mặc định!");
        });
    </script>
</body>
</html>
