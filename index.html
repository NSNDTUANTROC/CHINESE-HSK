<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Từ Vựng Hán Ngữ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f0ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 1050px;
        }

        /* Thanh điều khiển trên cùng */
        .toolbar {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .btn {
            border: none;
            padding: 9px 16px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-excel { background-color: #059669; }
        .btn-doi-de { background-color: #4f46e5; }
        .btn-lam-lai { background-color: #d97706; }
        .btn-xoa { background-color: #dc2626; }

        .select-input, .number-input {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            outline: none;
            font-size: 14px;
            background-color: #fff;
        }

        .number-input {
            width: 60px;
            text-align: center;
        }

        /* Khung bảng câu hỏi */
        .table-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #e0d5f9;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #eef2ff;
            color: #3730a3;
            padding: 14px 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
            font-size: 15px;
        }

        /* Màu sắc dữ liệu chữ Hán, Pinyin */
        .text-hanzi {
            font-size: 24px;
            font-weight: bold;
            color: #991b1b;
        }

        .text-pinyin {
            color: #065f46;
            font-weight: 600;
            font-style: italic;
        }

        .text-type {
            color: #991b1b;
            font-size: 13px;
        }

        /* Ô nhập đáp án */
        .input-answer {
            width: 100%;
            max-width: 170px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-answer:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Trạng thái khi bị khóa sau khi nhấn Enter */
        .input-answer:disabled {
            background-color: #ffffff;
            color: #1e293b;
            font-weight: 600;
            border-color: #cbd5e1;
            cursor: not-allowed;
        }

        /* Màu sắc hàng khi Đúng/Sai */
        tr.row-dung {
            background-color: #e6f4ea !important;
        }
        tr.row-dung .text-hanzi, tr.row-dung .text-pinyin, tr.row-dung td {
            color: #0d652d !important;
        }

        tr.row-sai {
            background-color: #fce8e6 !important;
        }
        tr.row-sai .text-hanzi, tr.row-sai .text-pinyin, tr.row-sai td {
            color: #c5221f !important;
        }

        /* Tag trạng thái */
        .status-tag {
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-dung { color: #0d652d; }
        .status-sai { color: #c5221f; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="toolbar">
        <button class="btn btn-excel">📁 Chọn Excel</button>

        <div class="toolbar-group">
            <span>🎯 Chế độ</span>
            <select id="select-che-do" class="select-input" onchange="renderBang()">
                <option value="1">Gõ Nghĩa Tiếng Việt (Hiện sẵn Chữ Hán)</option>
                <option value="2">Chỉ gõ Chữ Hán (Hiện Tiếng Việt)</option>
            </select>
        </div>

        <div class="toolbar-group">
            <span>🔄 Trộn câu</span>
            <select id="select-tron" class="select-input">
                <option value="order">Theo thứ tự</option>
                <option value="random">Đảo ngẫu nhiên</option>
            </select>
        </div>

        <div class="toolbar-group">
            <span>📊 Khoảng</span>
            <input type="number" class="number-input" value="1" id="from-index">
            <span>đến</span>
            <input type="number" class="number-input" value="80" id="to-index">
        </div>

        <button class="btn btn-doi-de" onclick="doiDe()">⚡ Đổi đề</button>
        <button class="btn btn-lam-lai" onclick="lamLai()">♻️ Làm lại</button>
        <button class="btn btn-xoa" onclick="xoaData()">🗑️ Xóa data</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">STT</th>
                    <th>CHỮ HÁN</th>
                    <th>LOẠI TỪ</th>
                    <th>PINYIN</th>
                    <th>TIẾNG VIỆT</th>
                    <th style="width: 190px;">Ô NHẬP</th>
                    <th style="width: 120px;">TRẠNG THÁI</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    // 1. Dữ liệu từ vựng gốc theo đúng hình của bạn
    const defaultData = [
        { stt: 1, chuHan: "烤肉", loaiTu: "Danh từ", pinyin: "kǎoròu", tiengViet: "Thịt nướng" },
        { stt: 2, chuHan: "炒", loaiTu: "Động từ", pinyin: "chǎo", tiengViet: "Rang, xào" },
        { stt: 3, chuHan: "炒饭", loaiTu: "Danh từ", pinyin: "chǎofàn", tiengViet: "Cơm rang, cơm xào" },
        { stt: 4, chuHan: "红烧肉", loaiTu: "Danh từ", pinyin: "hóngshāo ròu", tiengViet: "Thịt kho (thịt kho tàu / kho hồng xíu)" },
        { stt: 5, chuHan: "红烧鱼", loaiTu: "Danh từ", pinyin: "hóngshāo yú", tiengViet: "Cá kho (cá kho hồng xíu)" }
    ];

    let currentData = [...defaultData];

    // 2. HÀM SO SÁNH ĐÁP ÁN TIẾNG VIỆT THÔNG MINH
    function checkVietnameseAnswer(userInput, targetAnswer) {
        if (!userInput || !targetAnswer) return false;

        // Chuẩn hóa input người dùng (hạ chữ thường, xóa khoảng trắng thừa, chuẩn hóa Unicode NFC)
        const userStr = userInput.toLowerCase().trim().normalize("NFC");

        let validList = [];

        // Tách chuỗi gốc theo dấu phẩy (,) và dấu xuyệt (/)
        let parts = targetAnswer.split(/[,/]/);

        parts.forEach(part => {
            // Lấy từ ngoài dấu ngoặc đơn ()
            let mainText = part.replace(/\(.*?\)/g, '').trim();
            if (mainText) validList.push(mainText);

            // Lấy từ nằm trong dấu ngoặc ()
            let insideMatch = part.match(/\((.*?)\)/);
            if (insideMatch && insideMatch[1]) {
                insideMatch[1].split('/').forEach(sub => {
                    if (sub.trim()) validList.push(sub.trim());
                });
            }
        });

        // Chuẩn hóa toàn bộ danh sách đáp án đúng
        const normalizedList = validList.map(item => item.toLowerCase().trim().normalize("NFC"));

        return normalizedList.includes(userStr);
    }

    // 3. Render bảng ra màn hình
    function renderBang() {
        const tbody = document.getElementById('table-body');
        const cheDo = document.getElementById('select-che-do').value;
        tbody.innerHTML = '';

        currentData.forEach((item, index) => {
            const tr = document.createElement('tr');

            let textChuHan = item.chuHan;
            let textTiengViet = item.tiengViet;
            let targetCorrect = (cheDo === "1") ? item.tiengViet : item.chuHan;

            if (cheDo === "2") textChuHan = "***";

            tr.innerHTML = `
                <td>${item.stt}</td>
                <td class="text-hanzi">${textChuHan}</td>
                <td class="text-type">${item.loaiTu}</td>
                <td class="text-pinyin">${item.pinyin}</td>
                <td>${textTiengViet}</td>
                <td>
                    <input type="text" class="input-answer" data-index="${index}" data-correct="${targetCorrect}" placeholder="">
                </td>
                <td class="status-cell">---</td>
            `;
            tbody.appendChild(tr);
        });

        attachEnterEvent();
    }

    // 4. BẮT SỰ KIỆN ENTER ĐỂ KHÓA VÀ CHẤM ĐIỂM
    function attachEnterEvent() {
        const inputs = document.querySelectorAll('.input-answer');

        inputs.forEach((input, idx) => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

                    const val = this.value.trim();
                    if (!val) return;

                    const correctVal = this.getAttribute('data-correct');
                    const row = this.closest('tr');
                    const statusCell = row.querySelector('.status-cell');

                    // KHÓA Ô NHẬP LẠI (KHÔNG CHO SỬA)
                    this.disabled = true;

                    // KIỂM TRA ĐÁP ÁN
                    const isCorrect = checkVietnameseAnswer(val, correctVal);

                    if (isCorrect) {
                        statusCell.innerHTML = '<span class="status-tag status-dung">❎ Đúng</span>';
                        row.className = 'row-dung';
                    } else {
                        statusCell.innerHTML = '<span class="status-tag status-sai">❎ Sai</span>';
                        row.className = 'row-sai';
                    }

                    // TỰ ĐỘNG CHUYỂN CON TRỎ SANG Ô TIẾP THEO
                    if (inputs[idx + 1]) {
                        inputs[idx + 1].focus();
                    }
                }
            });
        });
    }

    // Các hàm xử lý nút điều khiển
    function doiDe() {
        const isRandom = document.getElementById('select-tron').value === 'random';
        if (isRandom) {
            currentData.sort(() => Math.random() - 0.5);
        } else {
            currentData = [...defaultData];
        }
        renderBang();
    }

    function lamLai() {
        renderBang();
    }

    function xoaData() {
        document.querySelectorAll('.input-answer').forEach(inp => {
            inp.value = '';
            inp.disabled = false;
        });
        document.querySelectorAll('.status-cell').forEach(td => td.innerHTML = '---');
        document.querySelectorAll('tr').forEach(tr => tr.className = '');
    }

    // Chạy khi khởi tạo trang
    window.onload = renderBang;
</script>

</body>
</html>
