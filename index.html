<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Từ Vựng HSK</title>
    <!-- Font chữ Google Roboto & Noto Sans SC cho chữ Hán đẹp hơn -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Thư viện SheetJS đọc file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ================= GIAO DIỆN HIỆN ĐẠI & MÀU SẮC ================= */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }

        body { 
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 15px;
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-size: 14px; 
            box-sizing: border-box;
        }
        
        .header-title {
            text-align: center;
            margin: 0 0 15px 0;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        .controls label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .controls select, .controls input[type="number"] {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }

        .controls select:focus, .controls input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        
        .btn { 
            padding: 8px 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            color: white; 
            font-size: 13px; 
            white-space: nowrap; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-purple { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .container { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
        }

        .table-container { 
            flex: 1; 
            min-width: 300px; 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            overflow-x: auto; 
        }
        
        table { 
            width: 100%; 
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed; 
        }

        th, td { 
            border-bottom: 1px solid #e5e7eb; 
            padding: 10px 6px; 
            text-align: center; 
            word-wrap: break-word; 
            transition: background-color 0.3s ease;
        }

        th { 
            background-color: #f9fafb; 
            font-weight: 700;
            color: #4b5563;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px solid #e5e7eb;
        }

        th:first-child { border-top-left-radius: 8px; border-left: 1px solid #e5e7eb; }
        th:last-child { border-top-right-radius: 8px; border-right: 1px solid #e5e7eb; }
        td:first-child { border-left: 1px solid #e5e7eb; }
        td:last-child { border-right: 1px solid #e5e7eb; }
        
        /* Cột chữ Hán đẹp hơn */
        .col-hanzi { 
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 18px; 
            font-weight: 700; 
            color: #111827;
        }

        /* Tỉ lệ các cột */
        .col-stt { width: 6%; color: #9ca3af; }
        .col-type { width: 12%; color: #6b7280; font-size: 12px; }
        .col-pinyin { width: 16%; color: #4b5563; font-style: italic; }
        .col-viet { width: 25%; font-weight: 500; }
        .col-input { width: 18%; }
        .col-status { width: 8%; }

        input[type="text"] { 
            width: 85%; 
            padding: 6px 8px; 
            border: 1.5px solid #d1d5db; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 15px; 
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        
        /* === MÀU NỀN TÔ DÒNG KHI ĐÚNG / SAI === */
        tr.row-correct td { 
            background-color: #ecfdf5 !important; 
            color: #065f46;
        }
        tr.row-wrong td { 
            background-color: #fef2f2 !important; 
            color: #991b1b;
        }

        .correct { color: #10b981; font-weight: 700; }
        .wrong { color: #ef4444; font-weight: 700; }
        
        .stats-card { 
            width: 200px; 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            height: fit-content; 
        }

        .stats-card h3 { 
            font-size: 14px; 
            margin-top: 0; 
            margin-bottom: 12px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .loading-msg { 
            font-style: italic; 
            color: var(--success); 
            font-weight: 600; 
            margin-left: 5px; 
            font-size: 12px; 
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .header-title { font-size: 18px; margin-bottom: 10px; }
            .controls { padding: 10px; gap: 8px; justify-content: center; }
            .btn { padding: 6px 10px; font-size: 11px; }
            .container { flex-direction: column; gap: 10px; }
            .table-container { padding: 6px; }
            th, td { padding: 8px 2px; font-size: 12px; }
            .col-stt, .col-type, .col-status { display: none; }
            .col-hanzi { width: 26%; font-size: 16px; }
            .col-pinyin { width: 22%; }
            .col-viet { width: 28%; }
            .col-input { width: 24%; }
            input[type="text"] { font-size: 16px; padding: 5px 0; width: 95%; }
            .stats-card { width: auto; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <h2 class="header-title">🎓 LUYỆN TỪ VỰNG HSK</h2>

    <div class="controls">
        <label class="btn btn-green">
            📁 Chọn File Excel
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;">
        </label>
        
        <label>Chế độ: 
            <select id="modeSelect">
                <option value="pinyin_to_chinese">Gõ Pinyin/Tiếng Trung (Từng Tiếng Việt)</option>
                <option value="chinese_to_meaning">Gõ Nghĩa Tiếng Việt (Từng Tiếng Trung)</option>
            </select>
        </label>

        <label>Số câu: 
            <input type="number" id="quizSize" value="10" min="1" style="width: 45px; text-align: center;">
        </label>

        <button class="btn btn-purple" id="btnNewQuiz">🔀 Đổi đề mới</button>
        <button class="btn btn-orange" id="btnRetryQuiz">🔄 Làm lại</button>
        <button class="btn btn-red" id="btnReset">🗑 Xóa dữ liệu</button>
        <span id="loadingStatus" class="loading-msg"></span>
    </div>

    <div class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-stt">STT</th>
                        <th class="col-hanzi">Chữ Hán</th>
                        <th class="col-type">Loại từ</th>
                        <th class="col-pinyin">Pinyin</th>
                        <th class="col-viet">Tiếng Việt</th>
                        <th class="col-input">Ô nhập</th>
                        <th class="col-status">Kết quả</th>
                    </tr>
                </thead>
                <tbody id="vocabTable"></tbody>
            </table>
        </div>

        <div class="stats-card">
            <h3 style="text-align: center;">📊 THỐNG KÊ</h3>
            <div class="stats-item"><span>Tổng số câu:</span><b id="statTotal">0</b></div>
            <div class="stats-item"><span>Đã làm:</span><b id="statDone">0</b></div>
            <div class="stats-item" style="color: #10b981;"><span>Đúng:</span><b id="statCorrect">0</b></div>
            <div class="stats-item" style="color: #ef4444;"><span>Sai:</span><b id="statWrong">0</b></div>
            <hr style="border: 0; border-top: 1px dashed #e5e7eb; margin: 8px 0;">
            <div class="stats-item" style="font-size: 14px;"><span>Tỷ lệ đúng:</span><b id="statRate" style="color: #ef4444;">0.0%</b></div>
        </div>
    </div>

    <script>
        const EMBEDDED_VOCAB_DATA = [
            {"chinese": "工人", "type": "Danh từ", "pinyin": "gōngrén", "meaning": "Công nhân"},
            {"chinese": "经理", "type": "Danh từ", "pinyin": "jīnglǐ", "meaning": "Giám đốc"},
            {"chinese": "谁", "type": "Đại từ", "pinyin": "shéi / shuí", "meaning": "Ai"},
            {"chinese": "包子", "type": "Danh từ", "pinyin": "bāozi", "meaning": "Bánh bao (có nhân)"},
            {"chinese": "睡觉", "type": "Động từ", "pinyin": "shuì jiào", "meaning": "Ngủ"}
        ];

        let fullVocabData = [];
        let currentQuizData = [];

        window.onload = function() {
            const savedData = localStorage.getItem('hsk_vocab_data');
            if (savedData) {
                try {
                    fullVocabData = JSON.parse(savedData);
                } catch(e) {
                    fullVocabData = [...EMBEDDED_VOCAB_DATA];
                }
            } else {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            startNewQuiz();
        };

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('loadingStatus');
            if (statusText) statusText.innerText = "⏳ Đang nạp...";

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = e.target.result;
                    const workbook = XLSX.read(data, { type: 'binary' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (!json || json.length === 0) {
                        alert("File Excel trống hoặc không đọc được dữ liệu!");
                        if (statusText) statusText.innerText = "";
                        return;
                    }

                    fullVocabData = json.map(row => ({
                        chinese: row['CHENESE'] || row['Tiếng Trung'] || row['Chữ Hán'] || row['Word'] || row['Chinese'] || row['CHỮ HÁN'] || '',
                        type: row['VOCABULARY'] || row['Loại từ'] || row['Type'] || row['LOẠI TỪ'] || '',
                        pinyin: row['PINYIN'] || row['Pinyin'] || row['Phát âm'] || row['Phien am'] || '',
                        meaning: row['MEANING'] || row['Tiếng Việt'] || row['Nghĩa'] || row['Meaning'] || row['NGHĨA TIẾNG VIỆT'] || ''
                    })).filter(item => item.chinese || item.meaning);

                    localStorage.setItem('hsk_vocab_data', JSON.stringify(fullVocabData));
                    if (statusText) statusText.innerText = "✅ Đã nạp xong!";
                    startNewQuiz();
                    alert("Thành công! Đã nạp " + fullVocabData.length + " từ vựng.");

                } catch (err) {
                    alert("Lỗi đọc file: " + err.message);
                    if (statusText) statusText.innerText = "❌ Lỗi file";
                }
            };
            reader.readAsBinaryString(file);
        });

        function startNewQuiz() {
            if (!fullVocabData || fullVocabData.length === 0) {
                fullVocabData = [...EMBEDDED_VOCAB_DATA];
            }
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            const shuffled = [...fullVocabData].sort(() => 0.5 - Math.random());
            currentQuizData = shuffled.slice(0, Math.min(size, fullVocabData.length));
            renderTable();
        }

        function retryCurrentQuiz() {
            if (currentQuizData.length === 0) return;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('vocabTable');
            const mode = document.getElementById('modeSelect').value;
            tbody.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                
                const isPinyinMode = (mode === 'pinyin_to_chinese');
                
                const chineseDisplay = isPinyinMode ? '***' : item.chinese;
                const pinyinDisplay = '***';
                const meaningDisplay = !isPinyinMode ? '***' : item.meaning;

                tr.innerHTML = `
                    <td class="col-stt">${index + 1}</td>
                    <td id="chinese_${index}" class="col-hanzi">${chineseDisplay}</td>
                    <td class="col-type">${item.type}</td>
                    <td id="pinyin_${index}" class="col-pinyin">${pinyinDisplay}</td>
                    <td id="meaning_${index}" class="col-viet">${meaningDisplay}</td>
                    <td class="col-input">
                        <input type="text" id="input_${index}" 
                               enterkeyhint="next" 
                               oncompositionend="handleCompositionEnd(${index})"
                               onkeydown="handleKeyDown(event, ${index})">
                    </td>
                    <td id="status_${index}" class="col-status">-</td>
                `;
                tbody.appendChild(tr);
            });

            updateStats();
        }

        function handleCompositionEnd(index) {
            setTimeout(() => {
                moveToNext(index);
            }, 80);
        }

        function moveToNext(index) {
            checkAnswer(index);
            const nextInput = document.getElementById(`input_${index + 1}`);
            if (nextInput) {
                setTimeout(() => {
                    nextInput.focus();
                    if (nextInput.select) nextInput.select();
                }, 100);
            }
        }

        function handleKeyDown(event, index) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                moveToNext(index);
            }
        }

        function checkAnswer(index) {
            const inputEl = document.getElementById(`input_${index}`);
            if (!inputEl) return;
            
            const inputVal = inputEl.value.trim().toLowerCase();
            const mode = document.getElementById('modeSelect').value;
            const item = currentQuizData[index];
            const statusTd = document.getElementById(`status_${index}`);
            const rowTr = document.getElementById(`row_${index}`);

            if (inputVal === '') {
                statusTd.innerText = '-';
                statusTd.className = 'col-status';
                rowTr.className = '';
                updateStats();
                return;
            }

            let isCorrect = false;
            if (mode === 'pinyin_to_chinese') {
                const targetPinyin = (item.pinyin || '').toLowerCase();
                const targetChinese = (item.chinese || '').toLowerCase();
                if (inputVal === targetPinyin || inputVal === targetChinese) {
                    isCorrect = true;
                }
            } else {
                const targetMeaning = (item.meaning || '').toLowerCase();
                if (targetMeaning.includes(inputVal) && inputVal.length >= 1) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                statusTd.innerText = '✓ Đúng';
                statusTd.className = 'col-status correct';
                rowTr.className = 'row-correct'; 
            } else {
                statusTd.innerText = '✗ Sai';
                statusTd.className = 'col-status wrong';
                rowTr.className = 'row-wrong'; 
            }

            document.getElementById(`chinese_${index}`).innerText = item.chinese;
            document.getElementById(`pinyin_${index}`).innerText = item.pinyin;
            document.getElementById(`meaning_${index}`).innerText = item.meaning;

            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0, correct = 0, wrong = 0;

            currentQuizData.forEach((_, index) => {
                const statusTd = document.getElementById(`status_${index}`);
                if (statusTd) {
                    if (statusTd.classList.contains('correct')) {
                        done++;
                        correct++;
                    } else if (statusTd.classList.contains('wrong')) {
                        done++;
                        wrong++;
                    }
                }
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statWrong').innerText = wrong;
            
            const rate = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        document.getElementById('btnNewQuiz').addEventListener('click', startNewQuiz);
        document.getElementById('btnRetryQuiz').addEventListener('click', retryCurrentQuiz);
        document.getElementById('modeSelect').addEventListener('change', renderTable);
        document.getElementById('btnReset').addEventListener('click', function() {
            localStorage.removeItem('hsk_vocab_data');
            fullVocabData = [...EMBEDDED_VOCAB_DATA];
            const statusText = document.getElementById('loadingStatus');
            if (statusText) statusText.innerText = "";
            startNewQuiz();
            alert("Đã xóa dữ liệu tạm và khôi phục về mặc định!");
        });
    </script>
</body>
</html>
